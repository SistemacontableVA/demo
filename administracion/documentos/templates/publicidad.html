    /* Municipio — "Municipio: VALOR" */
    .municipio {
      left:        265px;
      top:         335px;
      width:       395px;
      text-align:  center;
      font-family: lato, sans-serif;
      font-size:   40px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .municipio .fijo    { color: #ffffff; }
    .municipio .dinamico { color: #d49500; }

    /* Institucion */
    .institucion {
      left:        320px;
      top:         548px;
      width:       525px;
      text-align:  center;
      font-family: lato, sans-serif;
      font-size:   35px;
      font-weight: 1000;
      color:       #00363a;
      white-space: normal;
      word-break:  break-word;
    }

    /* Fecha */
    .fecha {
      left:        140px;
      top:         1162px;
      width:       350px;
      text-align:  left;
      font-family: lato, sans-serif;
      font-size:   29px;
      font-weight: 700;
      white-space: nowrap;
    }

    .fecha .fijo    { color: #ffffff; }
    .fecha .dinamico { color: #d49500; }



    /* Horario — "Horario: VALOR" */
    .horario {
      left:        140px;
      top:         1200px;
      width:       355px;
      text-align:  left;
      font-family: lato, sans-serif;
      font-size:   29px;
      font-weight: 700;
      white-space: nowrap;
    }
    .horario .fijo    { color: #ffffff; }
    .horario .dinamico { color: #d49500; }

    @media print {
      body { margin: 0; padding: 0; background: #fff; }
      .publicidad { page-break-after: avoid; }
      @page { size: 1055px 1491px; margin: 0; }

</head>

  <div class="publicidad">
    <div class="campo municipio">
      <span class="fijo">Municipio: </span><span class="dinamico">{{Municipio}}</span>
    </div>
    <div class="campo institucion">{{Institucion}}</div>
    <div class="campo fecha"><span class="fijo">Fecha: </span><span class="dinamico">{{Fecha}}</span></div>
    <div class="campo horario">
      <span class="fijo">Horario: </span><span class="dinamico">{{Horario}}</span>
    </div>
  </div>
